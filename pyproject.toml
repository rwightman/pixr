[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "pixr"
authors = [
    {name = "Ross Wightman", email = "ross@huggingface.co"},
    {name = "Pablo Montalvo-Leroux", email = "pablo@huggingface.co"},
]
description = ""
readme = "README.md"
requires-python = ">=3.10"
keywords = ["document", "document-ai", "transformers", "ocr", "scale"]
license = {text = "Apache-2.0"}
classifiers = [
        'Development Status :: 4 - Beta',
        'Intended Audience :: Education',
        'Intended Audience :: Science/Research',
        'License :: OSI Approved :: Apache Software License',
        'Programming Language :: Python :: 3.7',
        'Programming Language :: Python :: 3.8',
        'Programming Language :: Python :: 3.9',
        'Programming Language :: Python :: 3.10',
        'Programming Language :: Python :: 3.11',
        'Topic :: Scientific/Engineering',
        'Topic :: Scientific/Engineering :: Artificial Intelligence',
        'Topic :: Software Development',
        'Topic :: Software Development :: Libraries',
        'Topic :: Software Development :: Libraries :: Python Modules',
]
dependencies = [
    "torch",
    # NOTE NaFlexVit attn_backend and pretrained linear patch embed in_chans adaptation need the timm
    # naflex-attn-backends branch (based on, and still versioned as, 1.0.31), raise this pin once released
    "timm>=1.0.31",
    "transformers",  # tokenizers only
    "huggingface_hub",
    "safetensors",
    "chugr",
    "Levenshtein",
    "pyyaml",
    "jsonargparse",
    "tiktoken",
]
dynamic = ["version"]

[project.urls]
homepage = "https://github.com/rwightman/pixr"
repository = "https://github.com/rwightman/pixr"

[tool.pdm.version]
source = "file"
path = "src/pixr/version.py"